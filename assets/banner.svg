<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Kaung Myat, back-end software engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5A4"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#panel)"/>

  <!-- Logo -->
  <g transform="translate(64 66) scale(1.2)">
    <rect width="120" height="120" rx="28" fill="url(#badge)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 32 V88"/>
      <path d="M26 62 L48 36"/>
      <path d="M32 58 L50 88"/>
      <path d="M62 88 V32 L79 62 L96 32 V88"/>
    </g>
    <circle cx="48" cy="36" r="7" fill="#99F6E4" stroke="#0F172A" stroke-width="3"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="250" y="130" font-size="60" font-weight="700" fill="#F8FAFC">Kaung Myat</text>
    <text x="252" y="176" font-size="26" fill="#C7D2FE">Back-end software engineer</text>
    <text x="252" y="212" font-size="19" fill="#94A3B8">Payment integrations, external APIs, authentication and authorization</text>
  </g>

  <!-- Service-flow motif -->
  <g stroke="url(#line)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M900 140 L980 84"/>
    <path d="M900 140 L980 196"/>
    <path d="M980 84 L1070 140"/>
    <path d="M980 196 L1070 140"/>
    <path d="M1070 140 L1136 140"/>
  </g>
  <g>
    <circle cx="900" cy="140" r="14" fill="#6366F1"/>
    <circle cx="980" cy="84" r="10" fill="#818CF8"/>
    <circle cx="980" cy="196" r="10" fill="#818CF8"/>
    <circle cx="1070" cy="140" r="14" fill="#2DD4BF"/>
    <circle cx="1136" cy="140" r="8" fill="#99F6E4"/>
  </g>
</svg>
